# /ROBCO/BOOT.CFG, the boot settings of the terminal chain.
# [boot] and [entry ...] are read by MFBootAgent. See BOOT_PROTOCOL.md in RobCo-Core.
[boot]
default = UOS
timeout = 3

[entry UOS]
path = /ROBCO/UOS.SYS
cmdline =

[entry MAINT]
path = /ROBCO/MAINT.SYS

[entry DIAG]
path = /ROBCO/DIAG.SYS

# Read by RETROS-BIOS. These are the defaults.
[bios]
delay_ms = 1000
beep = on
scheme = green
